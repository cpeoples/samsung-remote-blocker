# Full example stack with every setting inline. Works with
# `docker compose -f stack.example.yml up -d` and as a Portainer stack.
# Only TV_IP is required; delete what you don't use.
#
# On first start the TV shows an Allow prompt; accept it with the remote. Optional, for auto-resume:
#   docker compose -f stack.example.yml run --rm blocker plex-login
# Tokens are saved in the data volume. For several TVs, add one service per TV sharing the volume.
name: samsung-remote-blocker

services:
  blocker:
    image: ghcr.io/cpeoples/samsung-remote-blocker:latest  # or pin a release, e.g. :0.1.2
    restart: unless-stopped
    environment:
      TV_IP: 192.168.0.110
      BLOCKED_APPS: netflix,disney,prime,hulu,youtube
      ALLOWED_APPS: plex
      # Without PLEX_URL the blocker still returns to Plex, but doesn't press Play.
      PLEX_URL: http://192.168.0.20:32400
      # Defaults shown.
      POLL_SECONDS: "0.25"
      PLEX_POLL_SECONDS: "1"
      RESUME_WINDOW: "3"
      RESUME_DELAY: "2"
      TZ: America/New_York  # log timestamps
      # Already have a Plex token? Use the secret below instead of plex-login.
      # PLEX_TOKEN_FILE: /run/secrets/plex_token
      # Plex Media Server on this host? Read its token instead; see the mount below.
      # PLEX_PREFERENCES: /plex/Preferences.xml
    # secrets:
    #   - plex_token
    volumes:
      - data:/data  # or a folder
      # Plex's config folder, read-only. The folder, not the file, which Plex replaces on save.
      # - "/srv/appdata/plex/Library/Application Support/Plex Media Server:/plex:ro"

# The file holds just the token; chmod 600 it.
# secrets:
#   plex_token:
#     file: ./plex_token.txt

# Delete this section if you mount a folder at /data instead.
volumes:
  data:
