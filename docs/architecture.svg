<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Architecture</title>
  <desc id="desc">The blocker container on your server polls the TV's REST API, sends keys over WebSocket, and reads playback state from Plex Media Server. Nothing connects to it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141033"/>
    </linearGradient>
    <marker id="headBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7c8cff"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e5a00d"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="58" fill="#ffffff" font-size="26" font-weight="700">Everything stays on your network</text>
    <text x="60" y="88" fill="#8b90b8" font-size="17">The container only makes outbound requests, so there are no ports to open.</text>

    <!-- Server / container -->
    <rect x="60" y="130" width="360" height="220" rx="16" fill="#111733" stroke="#2c3366"/>
    <text x="84" y="162" fill="#8b90b8" font-size="13" font-weight="600" letter-spacing="1.2">YOUR SERVER</text>
    <rect x="84" y="178" width="312" height="148" rx="12" fill="#0b1020" stroke="#7c8cff" stroke-width="2"/>
    <g transform="translate(106 214)" fill="none" stroke="#7c8cff" stroke-width="2" stroke-linejoin="round">
      <path d="M0 18h40l-4 14H4z"/>
      <rect x="4" y="6" width="8" height="8"/><rect x="14" y="6" width="8" height="8"/><rect x="24" y="6" width="8" height="8"/>
      <rect x="14" y="-4" width="8" height="8"/>
    </g>
    <text x="162" y="226" fill="#ffffff" font-size="20" font-weight="700">Remote Blocker</text>
    <text x="162" y="250" fill="#8b90b8" font-size="14">Docker container</text>
    <rect x="106" y="276" width="268" height="32" rx="8" fill="#111733"/>
    <text x="120" y="297" fill="#c7cdff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/data  TV + <tspan fill="#e5a00d">Plex</tspan> tokens, 0600</text>

    <!-- TV -->
    <g transform="translate(820 110)">
      <rect width="320" height="126" rx="12" fill="#05070d" stroke="#3b4152" stroke-width="3"/>
      <rect x="12" y="12" width="296" height="102" rx="6" fill="#0d1430"/>
      <rect x="135" y="126" width="50" height="10" fill="#2a2f3d"/>
      <rect x="105" y="136" width="110" height="6" rx="3" fill="#2a2f3d"/>
      <text x="160" y="60" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Samsung Tizen TV</text>
      <text x="160" y="86" fill="#8b90b8" font-size="14" text-anchor="middle">tested on a 2024 DU8000</text>
    </g>

    <!-- Plex -->
    <g transform="translate(820 296)">
      <rect width="320" height="80" rx="12" fill="#1a1405" stroke="#e5a00d" stroke-width="2"/>
      <path d="M28 20l14 20l-14 20h10l14 -20l-14 -20z" fill="#e5a00d"/>
      <text x="72" y="37" fill="#ffffff" font-size="19" font-weight="700"><tspan fill="#e5a00d">Plex</tspan> Media Server</text>
      <text x="72" y="60" fill="#c9a24a" font-size="14">optional, for auto-resume</text>
    </g>

    <!-- links -->
    <path d="M420 170H808" stroke="#7c8cff" stroke-width="2.5" marker-end="url(#headBlue)"/>
    <text x="614" y="158" fill="#c7cdff" font-size="15" text-anchor="middle">app status every 0.25 s, launch, close</text>
    <text x="614" y="190" fill="#6b7199" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HTTPS :8002</text>

    <path d="M420 228H808" stroke="#7c8cff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#headBlue)"/>
    <text x="614" y="250" fill="#c7cdff" font-size="15" text-anchor="middle">remote keys: Play, Home</text>
    <text x="614" y="270" fill="#6b7199" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WebSocket :8002, paired once</text>

    <path d="M420 320C600 320 640 336 808 336" fill="none" stroke="#e5a00d" stroke-width="2.5" marker-end="url(#headAmber)"/>
    <text x="614" y="358" fill="#e9c46a" font-size="15" text-anchor="middle">was this TV playing?</text>
    <text x="614" y="380" fill="#8c7440" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GET /status/sessions</text>
  </g>
</svg>
